name: release

# Releasing is driven by the version field: bump `version` in package.json,
# merge to main, and this publishes. WXT copies that field into the manifest, so
# there is no second place to keep in sync.
on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # package.json also changes for dependency bumps, so the path filter alone
      # would release far too often.
      - name: Check whether the version changed
        id: check
        run: |
          NEW_VERSION=$(jq -r '.version' package.json)
          OLD_VERSION=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version' || echo 'none')
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "Version changed: $OLD_VERSION -> $NEW_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged: $NEW_VERSION"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      # Read into the job env so the submit steps can skip themselves when a
      # store has not been set up yet — `secrets` is not available in `if`.
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A store submission cannot be withdrawn once it enters review, so the
      # checks run again here rather than trusting the ci run on the same commit.
      - name: Type check
        run: pnpm compile

      - name: Unit test
        run: pnpm test

      # `zip:firefox` emits the extension zip and the sources zip AMO requires
      # for review.
      - name: Build and zip
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-zips-${{ env.VERSION }}
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true

      # Published first: the GitHub release is the artifact of record and does
      # not depend on any store credentials existing.
      - name: Create the GitHub release
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            .output/*-chrome.zip \
            .output/*-firefox.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Submit to the Chrome Web Store
        if: env.CHROME_CLIENT_ID != ''
        run: pnpm exec wxt submit --chrome-zip .output/*-chrome.zip

      - name: Submit to Firefox Add-ons
        if: env.FIREFOX_JWT_ISSUER != ''
        run: |
          pnpm exec wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

      - name: Note skipped stores
        if: env.CHROME_CLIENT_ID == '' || env.FIREFOX_JWT_ISSUER == ''
        run: |
          {
            echo "### Store submission skipped"
            [ -n "$CHROME_CLIENT_ID" ] || echo "- Chrome Web Store: no credentials configured"
            [ -n "$FIREFOX_JWT_ISSUER" ] || echo "- Firefox Add-ons: no credentials configured"
            echo ""
            echo "The zips are attached to [v${VERSION}](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${VERSION})."
          } >> "$GITHUB_STEP_SUMMARY"
