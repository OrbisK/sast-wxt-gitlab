name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # `postinstall` runs `wxt prepare`, which generates the `.wxt` types that
      # `pnpm compile` needs.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      - name: Unit test
        run: pnpm test

      # Both targets are built here because a manifest that only one browser
      # rejects would otherwise surface for the first time during a release.
      - name: Build (chrome)
        run: pnpm build

      - name: Build (firefox)
        run: pnpm build:firefox
